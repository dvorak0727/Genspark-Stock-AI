<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>台股AI分析器 — 授權碼管理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; padding: 24px; }
h1 { color: #f8fafc; font-size: 1.4rem; margin-bottom: 4px; }
.sub { color: #64748b; font-size: 0.83rem; margin-bottom: 24px; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.card h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 14px; }
label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; margin-top: 10px; }
input, select { width: 100%; padding: 9px 12px; border-radius: 7px; border: 1px solid #475569;
  background: #0f172a; color: #f8fafc; font-size: 0.9rem; outline: none; }
input:focus { border-color: #3b82f6; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
button { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.9rem; font-weight: 600; transition: opacity .15s; }
button:hover { opacity: .85; }
.btn-primary { background: #3b82f6; color: #fff; width: 100%; margin-top: 12px; }
.btn-danger  { background: #ef4444; color: #fff; padding: 5px 10px; font-size: 0.78rem; }
.btn-sm      { background: #334155; color: #94a3b8; padding: 5px 10px; font-size: 0.78rem; }
.result { margin-top: 12px; padding: 12px; border-radius: 8px; background: #0f172a;
  font-family: monospace; font-size: 0.85rem; word-break: break-all; display: none; }
.result.ok  { border: 1px solid #22c55e; color: #86efac; }
.result.err { border: 1px solid #ef4444; color: #fca5a5; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
th { text-align: left; padding: 8px 10px; color: #64748b; border-bottom: 1px solid #334155; }
td { padding: 8px 10px; border-bottom: 1px solid #1e293b; vertical-align: middle; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
.badge.active   { background: rgba(34,197,94,.15); color: #86efac; }
.badge.expired  { background: rgba(245,158,11,.15); color: #fcd34d; }
.badge.revoked  { background: rgba(239,68,68,.15);  color: #fca5a5; }
.key-val { font-family: monospace; font-size: 0.8rem; color: #93c5fd; cursor: pointer; }
.key-val:hover { text-decoration: underline; }
#loginWall { position: fixed; inset: 0; background: #0f172a; display: flex;
  align-items: center; justify-content: center; z-index: 99; }
#loginBox { background: #1e293b; border: 1px solid #334155; border-radius: 14px;
  padding: 36px; width: 320px; text-align: center; }
#loginBox h2 { color: #f8fafc; margin-bottom: 8px; }
#loginBox p  { color: #64748b; font-size: 0.82rem; margin-bottom: 20px; }
#loginMsg { color: #f87171; font-size: 0.8rem; margin-top: 10px; min-height: 18px; }
.notice { background: #1e3a5f; border: 1px solid #2563eb; border-radius: 8px;
  padding: 12px 14px; font-size: 0.8rem; color: #93c5fd; margin-top: 12px; line-height: 1.6; }
.notice code { background: #0f172a; padding: 1px 6px; border-radius: 4px; font-family: monospace; }
</style>
</head>
<body>

<!-- 登入牆 -->
<div id="loginWall">
  <div id="loginBox">
    <div style="font-size:2rem;margin-bottom:10px;">🔐</div>
    <h2>管理員登入</h2>
    <p>台股AI分析器 授權碼管理後台</p>
    <input id="adminPwInput" type="password" placeholder="管理員密碼" style="margin-bottom:10px;" />
    <button class="btn-primary" onclick="adminLogin()" style="margin-top:0;">登入</button>
    <div id="loginMsg"></div>
  </div>
</div>

<h1>🔑 台股AI分析器 — 授權碼管理</h1>
<p class="sub">管理員後台 · 個人授權碼發放與撤銷</p>

<!-- 產生個人碼 -->
<div class="card">
  <h2>➕ 產生新授權碼</h2>
  <div class="row">
    <div>
      <label>用戶姓名 / 備註</label>
      <input id="genUser" type="text" placeholder="例：王小明" />
    </div>
    <div>
      <label>有效期限</label>
      <input id="genExpiry" type="date" />
    </div>
  </div>
  <label>會員等級</label>
  <select id="genTier">
    <option value="standard">Standard（一般會員）</option>
    <option value="vip">VIP</option>
    <option value="premium">尊爵</option>
    <option value="admin">Admin（永久，管理員專用）</option>
  </select>
  <button class="btn-primary" onclick="generateKey()">產生授權碼</button>
  <div id="genResult" class="result"></div>
</div>

<!-- 用戶清單 -->
<div class="card">
  <h2>👥 目前授權用戶</h2>
  <button class="btn-sm" onclick="loadKeys()" style="margin-bottom:12px;">🔄 重新載入</button>
  <div id="keyTable">載入中…</div>
</div>

<!-- 一次性遷移（舊 Firestore/Cloud Run 系統 → license-worker） -->
<div class="card">
  <h2>🚚 一次性遷移舊系統資料</h2>
  <p class="sub" style="margin-bottom:12px;">把舊系統（Cloud Run + Firestore）裡的授權碼搬進這個新的
    license-worker 後台。⚠️ 只需要執行一次，執行前會先預覽清單、
    需要你確認後才會真的寫入，重複執行同一筆資料會覆蓋成同樣的內容
    （不會造成重複）。</p>
  <label>舊系統管理密碼（Cloud Run 那組，跟這個後台的登入密碼不同）</label>
  <input id="oldAdminSecret" type="password" placeholder="舊系統的 admin_secret" />
  <label>遷移後預設等級（舊資料沒有 tier 概念，統一先給這個等級，之後可以再個別調整）</label>
  <select id="migrateDefaultTier">
    <option value="standard">Standard（一般會員）</option>
    <option value="vip" selected>VIP</option>
    <option value="premium">尊爵</option>
  </select>
  <button class="btn-primary" onclick="previewMigration()" style="margin-top:12px;">① 預覽舊系統資料</button>
  <div id="migratePreview" style="display:none;margin-top:12px;">
    <div id="migratePreviewTable" style="max-height:240px;overflow:auto;"></div>
    <button class="btn-primary" onclick="runMigration()" style="background:#f59e0b;margin-top:10px;">
      ② 確認無誤，執行遷移
    </button>
  </div>
  <div id="migrateResult" class="result"></div>
</div>

<!-- 月份碼（共用） -->
<div class="card">
  <h2>📅 本月共用授權碼（管理員）</h2>
  <div class="row">
    <div>
      <label>月份</label>
      <input id="hmacMonth" type="month" />
    </div>
  </div>
  <button class="btn-primary" onclick="genHmac()" style="margin-top:12px;">產生月份碼</button>
  <div id="hmacResult" class="result"></div>
</div>

<script>
// v7.54：改接自己的 license-worker（Cloudflare Worker），不再打來源不明、
// 無法查證是否支援 tier 欄位的舊 Cloud Run 服務。
const API = 'https://license-worker.dvorak0727.workers.dev';
const OLD_API = 'https://stock-api-214539875795.asia-east1.run.app'; // 只有「遷移」功能還會用到
let ADMIN_SECRET = '';
const TIER_LABEL = { standard:'Standard', vip:'VIP', premium:'尊爵', admin:'Admin' };

function adminLogin() {
  const pw = document.getElementById('adminPwInput').value.trim();
  if (!pw) return;
  ADMIN_SECRET = pw;
  // 測試是否正確
  fetch(`${API}/admin/list?admin_secret=${encodeURIComponent(pw)}`)
    .then(r => r.json())
    .then(j => {
      if (Array.isArray(j.keys)) {
        document.getElementById('loginWall').style.display = 'none';
        loadKeys();
        // 預設今天加一個月
        const d = new Date(); d.setMonth(d.getMonth()+1); d.setDate(0);
        document.getElementById('genExpiry').value = d.toISOString().slice(0,10);
        document.getElementById('hmacMonth').value = new Date().toISOString().slice(0,7);
      } else {
        document.getElementById('loginMsg').textContent = '密碼錯誤';
      }
    })
    .catch(() => { document.getElementById('loginMsg').textContent = '連線失敗'; });
}

document.getElementById('adminPwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') adminLogin();
});

async function generateKey() {
  const user   = document.getElementById('genUser').value.trim() || 'user';
  const expiry = document.getElementById('genExpiry').value;
  const tier   = document.getElementById('genTier').value;
  if (!expiry) { alert('請選擇有效期限'); return; }

  const r = await fetch(`${API}/admin/generate?admin_secret=${encodeURIComponent(ADMIN_SECRET)}&user=${encodeURIComponent(user)}&expiry=${expiry}&tier=${tier}`);
  const j = await r.json();
  const el = document.getElementById('genResult');
  if (j.key) {
    el.className = 'result ok';
    el.style.display = 'block';
    el.innerHTML = `✅ 授權碼：<strong>${j.key}</strong><br/>用戶：${j.user}　有效期：${j.expiry}　等級：${TIER_LABEL[j.tier]||j.tier}<br/><br/>
      <span style="color:#64748b;font-size:0.75rem;">點擊複製授權碼</span>`;
    el.onclick = () => { navigator.clipboard.writeText(j.key); el.style.background='#1a2e1a'; setTimeout(()=>el.style.background='',800); };
    loadKeys();
  } else {
    el.className = 'result err';
    el.style.display = 'block';
    el.textContent = '產生失敗：' + JSON.stringify(j);
  }
}

async function loadKeys() {
  const r = await fetch(`${API}/admin/list?admin_secret=${encodeURIComponent(ADMIN_SECRET)}`);
  const j = await r.json();
  const el = document.getElementById('keyTable');
  if (!j.keys || j.keys.length === 0) {
    el.innerHTML = '<div style="color:#64748b;font-size:0.85rem;padding:8px 0;">目前沒有個人授權碼。</div>';
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  const rows = j.keys.map(k => {
    let badge;
    if (k.status === 'revoked') badge = '<span class="badge revoked">已撤銷</span>';
    else if (k.tier !== 'admin' && k.expiry && k.expiry < today) badge = '<span class="badge expired">已過期</span>';
    else badge = '<span class="badge active">有效</span>';
    return `<tr>
      <td><span class="key-val" onclick="navigator.clipboard.writeText('${k.key}');this.style.color='#86efac';setTimeout(()=>this.style.color='',800)" title="點擊複製">${k.key}</span></td>
      <td>${k.user || '—'}</td>
      <td>${TIER_LABEL[k.tier] || k.tier || '—'}</td>
      <td>${k.tier === 'admin' ? '永久' : (k.expiry || '—')}</td>
      <td>${badge}</td>
      <td>${k.status === 'revoked' ? '' : `<button class="btn-danger" onclick="revokeKey('${k.key}')">撤銷</button>`}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table>
    <thead><tr><th>授權碼</th><th>用戶</th><th>等級</th><th>到期日</th><th>狀態</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function revokeKey(key) {
  if (!confirm(`確定要撤銷授權碼 ${key} 嗎？撤銷後該用戶會立刻失去存取權限。`)) return;
  const r = await fetch(`${API}/admin/revoke?admin_secret=${encodeURIComponent(ADMIN_SECRET)}&key=${encodeURIComponent(key)}`);
  const j = await r.json();
  if (j.ok) loadKeys();
  else alert('撤銷失敗：' + JSON.stringify(j));
}

// ── 一次性遷移：舊 Cloud Run/Firestore 系統 → license-worker ──
let _migrationData = null;

async function previewMigration() {
  const oldSecret = document.getElementById('oldAdminSecret').value.trim();
  const el = document.getElementById('migrateResult');
  if (!oldSecret) { alert('請輸入舊系統的管理密碼'); return; }
  el.className = 'result'; el.style.display = 'none';
  try {
    const r = await fetch(`${OLD_API}?action=list&admin_secret=${encodeURIComponent(oldSecret)}`);
    const j = await r.json();
    if (!Array.isArray(j.keys)) throw new Error('舊系統回傳格式不對，或密碼錯誤：' + JSON.stringify(j));
    _migrationData = j.keys;
    const rows = j.keys.map(k => `<tr>
      <td>${k.key}</td><td>${k.user || '—'}</td><td>${k.expiry || '—'}</td>
    </tr>`).join('');
    document.getElementById('migratePreviewTable').innerHTML = `<table>
      <thead><tr><th>授權碼</th><th>用戶</th><th>到期日</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    document.getElementById('migratePreview').style.display = 'block';
    el.className = 'result ok'; el.style.display = 'block';
    el.textContent = `✅ 讀到舊系統 ${j.keys.length} 筆資料，確認上面清單無誤後按下面「執行遷移」。`;
  } catch (e) {
    el.className = 'result err'; el.style.display = 'block';
    el.textContent = '讀取舊系統失敗：' + e.message;
  }
}

async function runMigration() {
  if (!_migrationData || !_migrationData.length) { alert('請先預覽資料'); return; }
  if (!confirm(`確定要把這 ${_migrationData.length} 筆資料寫進 license-worker 嗎？`)) return;
  const defaultTier = document.getElementById('migrateDefaultTier').value;
  const records = _migrationData.map(k => ({
    key: k.key, user: k.user || '', expiry: k.expiry || '',
    tier: defaultTier, status: 'active',
  }));
  const el = document.getElementById('migrateResult');
  try {
    const r = await fetch(`${API}/admin/import`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_secret: ADMIN_SECRET, records }),
    });
    const j = await r.json();
    el.className = 'result ok'; el.style.display = 'block';
    el.textContent = `✅ 遷移完成：匯入 ${j.imported} 筆，跳過 ${j.skipped} 筆（缺授權碼或到期日）。`;
    document.getElementById('migratePreview').style.display = 'none';
    loadKeys();
  } catch (e) {
    el.className = 'result err'; el.style.display = 'block';
    el.textContent = '遷移失敗：' + e.message;
  }
}

async function genHmac() {
  const monthInput = document.getElementById('hmacMonth').value; // YYYY-MM
  if (!monthInput) { alert('請選擇月份'); return; }
  const month = monthInput.replace('-',''); // YYYYMM
  const secret = 'tsai2026stock';
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret),
    {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(month));
  const hex = Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,8).toUpperCase();
  const code = `TSAI-${month}-${hex}`;
  const el = document.getElementById('hmacResult');
  el.className = 'result ok';
  el.style.display = 'block';
  el.innerHTML = `月份碼：<strong>${code}</strong><br/><span style="color:#64748b;font-size:0.75rem;">點擊複製</span>`;
  el.onclick = () => { navigator.clipboard.writeText(code); el.style.background='#1a2e1a'; setTimeout(()=>el.style.background='',800); };
}
</script>
</body>
</html>
