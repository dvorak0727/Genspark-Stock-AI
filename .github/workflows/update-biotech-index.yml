name: 更新NBI生技指數（Yahoo Finance）

on:
  schedule:
    - cron: '2 23 * * 0-4' # v9.x：跟其他報價爬蟲錯開觸發分鐘，避免同時git push互搶失敗
  workflow_dispatch: {}

jobs:
  update-biotech-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝 requests
        run: pip install requests
      - name: 執行抓取腳本
        run: python fetch_biotech_index.py
      - name: 自動 commit 更新後的 biotech_index.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自動更新NBI生技指數 (Yahoo Finance)"
          file_pattern: biotech_index.json
