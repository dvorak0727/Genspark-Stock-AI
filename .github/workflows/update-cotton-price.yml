name: 更新棉花期貨報價（Yahoo Finance）

on:
  schedule:
    - cron: '6 23 * * 0-4' # v9.x：跟其他報價爬蟲錯開觸發分鐘，避免同時git push互搶失敗
  workflow_dispatch: {}

jobs:
  update-cotton-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝 requests
        run: pip install requests
      - name: 執行抓取腳本
        run: python fetch_cotton_price.py
      - name: 自動 commit 更新後的 cotton_price.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自動更新棉花期貨報價 (Yahoo Finance)"
          file_pattern: cotton_price.json
