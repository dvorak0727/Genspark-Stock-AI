name: 更新國際鐵礦砂期貨價格（Yahoo Finance）

on:
  schedule:
    # 台灣時間平日早上7點(UTC 23:00前一天)，抓最新收盤序列，
    # 剛好趕在台股9點開盤前更新完成，跟油價排程同步
    # v9.x：跟其他報價爬蟲錯開觸發分鐘，避免同時git push互搶失敗
    - cron: '14 23 * * 0-4'
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動觸發，方便第一次測試

jobs:
  update-iron-ore-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 requests
        run: pip install requests

      - name: 執行抓取腳本
        run: python fetch_iron_ore_price.py

      - name: 自動 commit 更新後的 iron_ore_price.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自動更新國際鐵礦砂期貨價格 (Yahoo Finance)"
          file_pattern: iron_ore_price.json
