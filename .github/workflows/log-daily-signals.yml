name: 每日訊號紀錄

# 台灣時間平日 20:00（收盤資料、板塊強弱都更新之後）把當天的各項條件逐檔存下來，並補上過去紀錄的後續報酬與近期有效性彙總。
# 沒有 FINMIND_TOKEN 也能跑（免費額度可能偏緊）；有的話會帶上。重跑同一天會覆蓋當天紀錄，是安全的。
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 記錄當日訊號
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 scripts/log_daily_signals.py
      - name: 有新資料才提交
        run: |
          if [ -n "$(git status --porcelain data/signal_log)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/signal_log
            git commit -m "資料：每日訊號紀錄 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main   # 其他排程也會推送，先對齊再推，避免互搶
            git push
          else
            echo "沒有新資料"
          fi
