name: 更新LIT鋰電池ETF（Yahoo Finance）

on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch: {}

jobs:
  update-ev-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝 requests
        run: pip install requests
      - name: 執行抓取腳本
        run: python fetch_ev_price.py
      - name: 自動 commit 更新後的 ev_price.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自動更新LIT鋰電池ETF (Yahoo Finance)"
          file_pattern: ev_price.json
