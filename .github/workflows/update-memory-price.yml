name: 更新記憶體現貨報價（TrendForce）

on:
  schedule:
    # 台灣時間下午3點後(第2盤報價14:20公布後緩衝)+3點半收盤 → UTC 07:00
    - cron: '0 7 * * 1-5'
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動觸發，方便第一次測試

jobs:
  update-memory-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 requests
        run: pip install requests

      - name: 執行抓取腳本
        run: python fetch_memory_price.py

      - name: 自動 commit 更新後的 memory_price.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自動更新記憶體現貨報價 (TrendForce)"
          file_pattern: memory_price.json
