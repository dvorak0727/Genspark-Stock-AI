<title>迷你台股分析器 ・ 存檔點7</title>
<!--
  【給 AI 的說明】這是一個「單一檔案」的迷你台股分析器，所有資料都已經放在下面「資料區」，
  不需要連網。使用者會一次一個步驟，請你幫他在這個頁面上「新增功能卡片」。
  規則：
  1. 請輸出完整的 HTML 檔案，不要省略任何一段，不要只給片段。
  2. 「資料區」(const DATA = ...) 一個字都不要改、不要刪、不要重新生成，原樣保留。
  3. 台股慣例：紅色＝漲／買超，綠色＝跌／賣超，不要用歐美的綠漲紅跌。
  4. 資料欄位：d日期 o開 h高 l低 c收 v成交量(張) f外資買賣超(張) t投信買賣超(張)
     s自營商自行買賣超(張) m融資餘額(張) sh融券餘額(張)。陣列由舊到新，最後一筆是最新一天。
  5. 資料裡沒有的東西不要編造；算不出來就明確顯示「資料不足」。
-->
<style>
:root{--bg:#f1f7f4;--card:#fff;--ink:#17332b;--muted:#6b8179;--line:#dbe8e2;--brand:#0f766e;--up:#e0343a;--down:#16a34a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 40px}
header h1{margin:0;font-size:1.35rem;color:var(--brand)}
header p{margin:2px 0 14px;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1rem}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.price-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px}
.big{font-size:2.3rem;font-weight:800;line-height:1.1}
.sub{font-size:.9rem;color:var(--muted)}
.ohlc{display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.ohlc b{color:var(--ink)}
svg{width:100%;height:auto;display:block}
.legend{font-size:.78rem;color:var(--muted);margin:8px 0 0}
footer{font-size:.75rem;color:var(--muted);margin-top:18px}

.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 8px;border-bottom:1px solid #eef4f1;text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.badge.up{background:#fdecec}.badge.down{background:#e8f6ee}.badge.flat{background:#eef2f0;color:var(--muted)}
.verdict{margin:12px 0 0;font-weight:700}
.hint{background:#f4faf7;border:1px dashed #b9d8cd;border-radius:10px;padding:10px 12px;font-size:.84rem;margin-top:12px}
.hint a{color:var(--brand)}

.badge.mid{background:#e8eef9;color:#1e40af}
.gauge{position:relative;height:16px;display:flex;margin:26px 0 6px}
.gauge i{display:block;height:100%}
.gauge .lo{width:30%;background:#cfe9da;border-radius:8px 0 0 8px}.gauge .md{width:40%;background:#e6ece9}.gauge .hi{width:30%;background:#f6d4d4;border-radius:0 8px 8px 0}
.mark{position:absolute;top:-22px;transform:translateX(-50%);font-size:.8rem;font-weight:700}
.gl{display:flex;font-size:.74rem;color:var(--muted)}
.gl span:nth-child(1){width:30%}.gl span:nth-child(2){width:40%;text-align:center}.gl span:nth-child(3){width:30%;text-align:right}
.nums{display:flex;gap:28px;flex-wrap:wrap;margin:14px 0 4px}
.nums .big2{font-size:1.9rem;font-weight:800;line-height:1.1}
.calc{font-size:.84rem;color:var(--muted);margin:6px 0 0;font-variant-numeric:tabular-nums}
.stage-label{font-size:1.25rem;font-weight:800;margin:2px 0 8px}
.reasons{font-size:.88rem;color:var(--muted);margin:0 0 8px;padding-left:1.2em}

.fresh{border-radius:10px;padding:10px 14px;font-size:.9rem;margin:0 0 12px}
.fresh.ok{background:#e6f4ec;color:#14532d}
.fresh.old{background:#fdecec;color:#991b1b;font-weight:700}
.short{background:#f8f3e4;border:1px dashed #d8c58a;border-radius:10px;padding:12px 14px;color:#7a5b00;font-weight:700}
.days-lbl{font-size:.86rem;color:var(--muted);align-self:center}
.brief p{margin:0 0 8px;font-size:1.02rem;line-height:1.85}
.brief .small{font-size:.8rem;color:var(--muted)}

.refresh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px}
#refreshBtn{border-color:var(--brand);color:var(--brand);font-weight:700}
#refreshBtn:disabled{opacity:.5;cursor:wait}
.rmsg{font-size:.86rem;color:var(--muted)}
.rmsg.ok{color:#14532d;font-weight:700}
.rmsg.bad{color:#991b1b;font-weight:700}

.lookup{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.lookup input{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem;width:220px;background:#fff;color:var(--ink)}
#lookupBtn:disabled{opacity:.5;cursor:wait}

.ma-row{align-items:center;margin-bottom:6px}
.ma-row .chip.ma5.on{background:#f59e0b;border-color:#f59e0b}
.ma-row .chip.ma20.on{background:#2563eb;border-color:#2563eb}
.ma-info{font-size:.9rem;line-height:1.85;color:var(--ink);margin-top:8px}

.ms-wrap{overflow-x:auto;margin:6px 0 4px}
.ms td.lab{font-weight:800;white-space:nowrap}
.ms td.na{color:var(--muted);font-size:.84rem}
.ms-sum{font-size:1.05rem;font-weight:800;margin:10px 0 6px;line-height:1.7}
.rules{font-size:.84rem;color:var(--muted);line-height:1.8;margin:8px 0 0}
.rules summary{cursor:pointer}
</style>
</head>

<div class="wrap">
  <header>
    <h1>迷你台股分析器</h1>
    <p>志工媽媽班 ・ 一次加一個功能，慢慢長成自己的分析器</p>
  </header>

  <div id="freshBar"></div>
  <div id="picker" class="chips"></div>

  <div class="refresh"><button id="refreshBtn" class="chip" type="button">🔄 更新這檔的最新資料</button><span id="refreshMsg" class="rmsg"></span></div>

  <section class="card" id="priceCard"></section>
  <section class="card" id="briefCard"></section>
  <section class="card">

    <div id="maRow" class="chips ma-row"></div>

  <div id="maInfo" class="ma-info"></div>
  </section>

  <!-- ▼▼▼ 新功能的卡片請加在這一行下面 ▼▼▼ -->
  <section class="card" id="instCard"></section>
  <section class="card" id="marginCard"></section>
  <section class="card" id="posCard"></section>
  <section class="card" id="stageCard"></section>

</div>

    const col = s.c[i] > s.o[i] ? '#e0343a' : s.c[i] < s.o[i] ? '#16a34a' : '#8a9a93';
    const yo = y(s.o[i]), yc = y(s.c[i]);
    const vh = s.v[i] / vMax * volH;
    g += `<g><title>${s.d[i]}  開${s.o[i]} 高${s.h[i]} 低${s.l[i]} 收${s.c[i]}  量${n0(s.v[i])}張</title>` +
         `<line x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="${y(s.h[i]).toFixed(1)}" y2="${y(s.l[i]).toFixed(1)}" stroke="${col}" stroke-width="1.6"/>` +
         `<rect x="${(cx - bw / 2).toFixed(1)}" y="${Math.min(yo, yc).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5, Math.abs(yc - yo)).toFixed(1)}" fill="${col}"/>` +
         `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(volTop + volH - vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${vh.toFixed(1)}" fill="${col}" opacity=".45"/></g>`;
  }
  const lab = i => s.d[i].slice(5).replace('-', '/');
  g += `<text x="${padL}" y="${H - 2}" font-size="11" fill="#6b8179">${lab(0)}</text>` +
       `<text x="${(W - padR) / 2}" y="${H - 2}" font-size="11" fill="#6b8179" text-anchor="middle">${lab(Math.floor(n / 2))}</text>` +
       `<text x="${W - padR}" y="${H - 2}" font-size="11" fill="#6b8179" text-anchor="end">${lab(n - 1)}</text>`;
  $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.name}近60日K線與成交量">${g}</svg>`;
}


/* ---- 三大法人 ---- */
function streak(a) {            // 從最新一天往回數，同方向連續幾天（遇到 0 就中斷）
  let d = 0, dir = 0;
  for (let i = a.length - 1; i >= 0; i--) {
    const sg = a[i] > 0 ? 1 : a[i] < 0 ? -1 : 0;
    if (sg === 0) break;
    if (dir === 0) dir = sg;
    if (sg !== dir) break;
    d++;
  }
  return { dir, d };
}
const sumLast = (a, k) => a.slice(-k).reduce((x, y) => x + y, 0);
const signed = v => (v > 0 ? '+' : '') + n0(v);
const streakBadge = st => !st.d ? '<span class="badge flat">持平／無資料</span>'
  : st.dir > 0 ? `<span class="badge up">連買 ${st.d} 天</span>` : `<span class="badge down">連賣 ${st.d} 天</span>`;

function renderInst() {
  if (view().d.length < 5) return short("instCard", "三大法人買賣超（單位：張）", 5);
  const s = view(), i = s.d.length - 1;
  const rows = [['外資', 'f'], ['投信', 't'], ['自營商（自行買賣）', 's']];
  const body = rows.map(([nm, k]) => {
    const a = s[k], v = a[i], five = sumLast(a, 5), st = streak(a);
    const c1 = v > 0 ? 'up' : v < 0 ? 'down' : 'flat', c5 = five > 0 ? 'up' : five < 0 ? 'down' : 'flat';
    return `<tr><td>${nm}</td><td class="${c1}">${signed(v)}</td><td class="${c5}">${signed(five)}</td><td>${streakBadge(st)}</td></tr>`;
  }).join('');

  // 近5日長條圖：每天三根（外資、投信、自營），向上＝買超（紅），向下＝賣超（綠）
  const W = 900, H = 200, base = 92, gw = (W - 20) / 5;
  const vals = [];
  for (let j = 4; j >= 0; j--) rows.forEach(([, k]) => vals.push(Math.abs(s[k][i - j])));
  const mx = Math.max(...vals, 1), scale = 52 / mx;
  let g = `<line x1="10" x2="${W - 10}" y1="${base}" y2="${base}" stroke="#c9d9d2"/>`;
  for (let j = 0; j < 5; j++) {
    const idx = i - 4 + j, gx = 10 + gw * j;
    rows.forEach(([, k], b) => {
      const v = s[k][idx], h = Math.max(1, Math.abs(v) * scale), x = gx + 28 + b * 44;
      const yy = v >= 0 ? base - h : base, col = v > 0 ? '#e0343a' : v < 0 ? '#16a34a' : '#8a9a93';
      g += `<rect x="${x}" y="${yy.toFixed(1)}" width="34" height="${h.toFixed(1)}" fill="${col}"/>` +
           `<text x="${x + 17}" y="${(v >= 0 ? yy - 4 : yy + h + 11).toFixed(1)}" font-size="10" fill="${col}" text-anchor="middle">${signed(v)}</text>` +
           `<text x="${x + 17}" y="${H - 22}" font-size="10" fill="#6b8179" text-anchor="middle">${['外', '投', '自'][b]}</text>`;
    });
    g += `<text x="${gx + gw / 2 - 6}" y="${H - 6}" font-size="11" fill="#6b8179" text-anchor="middle">${s.d[idx].slice(5).replace('-', '/')}</text>`;
  }

  const sf = streak(s.f), sT = streak(s.t);
  let msg;
  if (sf.dir > 0 && sf.d >= 3 && sT.dir > 0 && sT.d >= 3) msg = '🔥 外資、投信同時連買 3 天以上：法人方向一致，是比較強的訊號。';
  else if (sf.dir < 0 && sf.d >= 3 && sT.dir < 0 && sT.d >= 3) msg = '⚠️ 外資、投信同時連賣 3 天以上：法人方向一致偏空，要小心。';
  else if (sf.d && sT.d && sf.dir !== sT.dir) msg = '外資和投信方向不同，訊號分歧，先觀察，不要急著下結論。';
  else msg = '目前沒有明顯的「連續」訊號。單日買賣超意義有限，連續才是重點。';

  $('instCard').innerHTML = `
    <h2>三大法人買賣超（單位：張）</h2>
    <table class="tbl"><thead><tr><th>法人</th><th>${s.d[i].slice(5).replace('-', '/')} 今日</th><th>近 5 日累計</th><th>連續</th></tr></thead><tbody>${body}</tbody></table>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近5日三大法人買賣超長條圖" style="margin-top:12px">${g}</svg>
    <p class="verdict">${msg}</p>

      <b>自營商只算「自行買賣」</b>，避險部位不算——避險是為了對沖權證，不代表看多看空。<br>

      找 ${s.d[i]} 那天的外資買賣超，應該和上表「今日外資」一樣（單位都是張）。對不上就是哪裡算錯了。
    </div>`;
}


/* ---- 共用：位階、量比等數字 ---- */
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
function metrics(s) {
  const i = s.d.length - 1;
  const H = Math.max(...s.h.slice(i - 14, i + 1)), L = Math.min(...s.l.slice(i - 14, i + 1));   // 近15日最高、最低（含今天）
  const pos = (s.c[i] - L) / (H - L) * 100;                                                       // 位階：收盤在這個區間的哪個位置
  const volAvg = mean(s.v.slice(i - 15, i));                                                      // 前15日平均量（不含今天）
  return { i, H, L, pos, volAvg, vr: s.v[i] / volAvg,
    inst5: sumLast(s.f, 5) + sumLast(s.t, 5),                                                    // 外資＋投信近5日累計
    mChg5: s.m[i] - s.m[i - 5], shChg5: s.sh[i] - s.sh[i - 5], pChg5: s.c[i] - s.c[i - 5],
    red: s.c[i] > s.o[i] };
}

const midBadge = (st, up, down) => !st.d ? '<span class="badge flat">持平</span>'

/* ---- 更新最新資料：直接向 FinMind 公開介面要這一檔的資料（不需要金鑰）---- */
const FM = 'https://api.finmindtrade.com/api/v4/data';
const live = {};      // 更新過的股票：代號 -> 新資料（只存在這個頁面的記憶體裡，重新整理就回到預先下載的資料）
const rmsgs = {};     // 每一檔各自的更新結果訊息
function raw() { return live[cur] || DATA[cur]; }

async function fm(dataset, id, start, end) {
  // 最單純的 GET，不加任何標頭，瀏覽器才不會先送「預檢」被擋掉
  const r = await fetch(`${FM}?dataset=${dataset}&data_id=${id}&start_date=${start}&end_date=${end}`);
  const j = await r.json();
  if (j.status !== 200) throw new Error(j.msg || '資料來源回覆錯誤');
  return j.data;
}

/* 抓一檔股票：回傳「股價、三大法人、融資融券三種都齊全」的最近60天，格式跟 DATA 一樣 */
async function fetchStock(id, name) {
  const end = new Date(), start = new Date(end.getTime() - 130 * 86400000);
  const f = d => d.toLocaleDateString('sv-SE');                       // YYYY-MM-DD（本地日期）
  const [px, ch, mg] = await Promise.all([
    fm('TaiwanStockPrice', id, f(start), f(end)),
    fm('TaiwanStockInstitutionalInvestorsBuySell', id, f(start), f(end)),
    fm('TaiwanStockMarginPurchaseShortSale', id, f(start), f(end))]);
  if (!px.length) throw new Error('查不到這個代號的股價資料，請確認代號');
  const net = { Foreign_Investor: {}, Investment_Trust: {}, Dealer_self: {} };   // 只要這三種，避險(Dealer_Hedging)不要
  ch.forEach(r => { if (net[r.name]) net[r.name][r.date] = (r.buy || 0) - (r.sell || 0); });
  const mgd = {}; mg.forEach(r => { mgd[r.date] = r; });
  const priced = px.filter(r => +r.close > 0).sort((a, b) => a.date < b.date ? -1 : 1);
  // 只用「三種資料都有」的日子，避免把還沒公布或根本沒有的資料當成 0
  const rows = priced.filter(r => r.date in net.Foreign_Investor && r.date in net.Investment_Trust && r.date in net.Dealer_self && r.date in mgd).slice(-60);
  if (rows.length < 16) throw new Error(!ch.length || !mg.length ? '這檔缺少三大法人或融資融券資料' : '回傳的資料太少');
  const dates = rows.map(r => r.date), k = x => Math.round(x / 1000);          // 股 → 張
  const fresh = { name, d: dates,
    o: rows.map(r => r.open), h: rows.map(r => r.max), l: rows.map(r => r.min), c: rows.map(r => r.close),
    v: rows.map(r => k(r.Trading_Volume)),
    f: dates.map(d => k(net.Foreign_Investor[d])), t: dates.map(d => k(net.Investment_Trust[d])), s: dates.map(d => k(net.Dealer_self[d])),
    m: dates.map(d => +mgd[d].MarginPurchaseTodayBalance || 0), sh: dates.map(d => +mgd[d].ShortSaleTodayBalance || 0) };
  // 算不出來的情況，老實說，不硬算
  const last16 = fresh.v.slice(-16);
  if (!last16.some(x => x > 0)) throw new Error('這檔最近沒有成交量，無法計算量比');
  if (Math.max(...fresh.h.slice(-15)) === Math.min(...fresh.l.slice(-15))) throw new Error('最近 15 天價格完全沒有變動，無法計算位階');
  if (!(fresh.m.at(-1) > 0) || !(fresh.m.at(-6) > 0)) throw new Error('這檔的融資餘額是 0，無法計算券資比');
  return { fresh, latestPrice: priced.at(-1).date };
}

async function refreshData() {
  const id = cur, btn = $('refreshBtn');
  btn.disabled = true;
  rmsgs[id] = { cls: '', text: '更新中…' }; renderRefresh();
  try {
    const { fresh, latestPrice } = await fetchStock(id, DATA[id].name);
    const before = raw().d.at(-1), last = fresh.d.at(-1);
    live[id] = fresh;
    let text = last === before ? `已經是最新（最近一個交易日：${last}）` : `已更新：最新資料日期 ${last}（共 ${fresh.d.length} 個交易日）`;
    if (latestPrice !== last) text += `。股價已經有 ${latestPrice}，但三大法人或融資券還沒公布，所以先用 ${last}`;
    rmsgs[id] = { cls: 'ok', text };
  } catch (e) {
    // 失敗：原本的資料完全不動，也絕不用編造的數字頂替
    rmsgs[id] = { cls: 'bad', text: `⚠️ 抓不到最新資料（${e.message || e}）。目前仍使用 ${raw().d.at(-1)} 的資料。` };
  }
  renderAll();
  setTimeout(() => { btn.disabled = false; }, 5000);                    // 停用5秒，避免連續狂按用光次數
}

function renderRefresh() {
  const m = rmsgs[cur] || { cls: '', text: `目前使用：預先下載的資料（最後一天 ${DATA[cur].d.at(-1)}）` };
  $('refreshMsg').className = 'rmsg ' + m.cls; $('refreshMsg').textContent = m.text;
}
$('refreshBtn').onclick = refreshData;


/* ---- 查其他股票：輸入代號，頁面自己去抓；查不到就老實說 ---- */
function setLookup(cls, text) { $('lookupMsg').className = 'rmsg ' + cls; $('lookupMsg').textContent = text; }

async function lookupName(id) {
  try {   // 名稱查不到不影響主流程，就先用代號當名稱
    const r = await fetch(`${FM}?dataset=TaiwanStockInfo&data_id=${id}`);
    const j = await r.json();
    return (j.status === 200 && j.data.length && j.data[0].stock_name) || id;
  } catch (e) { return id; }
}

async function lookupStock() {
  const btn = $('lookupBtn'), id = $('idInput').value.trim().toUpperCase();
  if (!/^[0-9A-Z]{4,6}$/.test(id)) { setLookup('bad', '請輸入 4 到 6 碼的股票代號，例如 2891'); return; }
  if (DATA[id]) { cur = id; renderAll(); setLookup('ok', `已切換到 ${DATA[id].name} ${id}`); return; }
  btn.disabled = true; setLookup('', '查詢中…');
  try {
    const name = await lookupName(id);
    const { fresh } = await fetchStock(id, name);
    DATA[id] = fresh; IDS.push(id); cur = id;                           // 加進股票按鈕列
    rmsgs[id] = { cls: 'ok', text: `自選股：資料剛從 FinMind 抓回來，最新資料日期 ${fresh.d.at(-1)}` };
    setLookup('ok', `已加入：${name} ${id}`);
    renderAll();
  } catch (e) {
    setLookup('bad', `⚠️ 查不到「${id}」（${e.message || e}）。沒有資料就是沒有資料，這個頁面不會編。`);
  }
  setTimeout(() => { btn.disabled = false; }, 5000);
}
$('lookupBtn').onclick = lookupStock;
$('idInput').addEventListener('keydown', e => { if (e.key === 'Enter') lookupStock(); });


/* ---- 均線：最近 N 天收盤價的平均。算的時候往前借用更早的資料，不夠就空著，不補、不猜 ---- */
const MA_COLOR = { 5: '#f59e0b', 20: '#2563eb' };
const maOn = { 5: true, 20: true };
function maSeries(k) {                       // 回傳跟畫面上每一天對齊的陣列；資料不夠的那天是 null
  const raw = DATA[cur], n = view().d.length, off = raw.d.length - n;
  return Array.from({ length: n }, (_, i) => {
    const a = off + i - k + 1;
    return a < 0 ? null : raw.c.slice(a, off + i + 1).reduce((x, y) => x + y, 0) / k;
  });
}
function renderMA() {
  $('maRow').innerHTML = '<span class="days-lbl">均線：</span>' + [5, 20].map(k =>
    `<button class="chip ma${k} ${maOn[k] ? 'on' : ''}" data-k="${k}">${k} 日線</button>`).join('');
  document.querySelectorAll('#maRow .chip').forEach(b => b.onclick = () => { maOn[b.dataset.k] = !maOn[b.dataset.k]; renderAll(); });

  const s = view(), n = s.d.length, svg = document.querySelector('#chart svg');
  const W = 900, padL = 8, padR = 56, top = 10, priceH = 215;               // 跟 renderChart 用同一把尺
  const hi0 = Math.max(...s.h), lo0 = Math.min(...s.l), pad = (hi0 - lo0) * 0.05 || 1, hi = hi0 + pad, lo = lo0 - pad;
  const y = v => top + (hi - v) / (hi - lo) * priceH, step = (W - padL - padR) / n;
  let g = `<clipPath id="maClip"><rect x="${padL}" y="${top}" width="${W - padL - padR}" height="${priceH}"/></clipPath><g clip-path="url(#maClip)">`;
  const last = {};
  [5, 20].forEach(k => {
    const ma = maSeries(k); last[k] = ma[n - 1];
    if (!maOn[k]) return;
    let pts = [];
    const flush = () => { if (pts.length > 1) g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${MA_COLOR[k]}" stroke-width="2.2" stroke-linejoin="round"/>`; pts = []; };
    ma.forEach((v, i) => { if (v === null) flush(); else pts.push(`${(padL + step * i + step / 2).toFixed(1)},${y(v).toFixed(1)}`); });
    flush();
  });
  svg.insertAdjacentHTML('beforeend', g + '</g>');

  const c = s.c[n - 1], rel = (k) => last[k] === null ? `${k} 日線：資料不足，需要至少 ${k} 個交易日，算不出來。`
    : `收盤 ${c} 在 ${k} 日線（${last[k].toFixed(2)}）${c > last[k] ? '之上' : c < last[k] ? '之下' : '持平'}。`;
  let cross = '';
  if (last[5] !== null && last[20] !== null) cross = `5 日線（${last[5].toFixed(2)}）在 20 日線（${last[20].toFixed(2)}）${last[5] > last[20] ? '之上' : last[5] < last[20] ? '之下' : '持平'}。`;
  $('maInfo').innerHTML = `<b>均線怎麼看：</b>${rel(5)}${rel(20)}${cross}<br><span class="sub">均線只是過去價格的平均，會比價格慢一步，不是預測，也不是買賣訊號。</span>`;
}


/* ---- 多週期階段：同一組規則，分別看 5 / 10 / 20 / 30 / 60 日 ---- */
const WINDOWS = [5, 10, 20, 30, 60];
const TH = { hi: 70, lo: 40, boom: 1.5, quiet: 0.7 };      // 門檻都放在這裡，想調整只改這四個數字
function stageAt(N) {                                       // 用完整資料（不受「顯示天數」影響）；算不出來就回傳 { na: 原因 }
  const s = DATA[cur], n = s.d.length, i = n - 1;
  if (n < N + 1) return { na: `資料不足：需要至少 ${N + 1} 個交易日，目前只有 ${n} 個` };
  const H = Math.max(...s.h.slice(i - N + 1)), L = Math.min(...s.l.slice(i - N + 1));
  if (H === L) return { na: `近 ${N} 日價格完全沒有變動，位階算不出來` };
  const volAvg = mean(s.v.slice(i - N, i));
  if (!volAvg) return { na: `前 ${N} 日沒有成交量，量比算不出來` };
  const pos = (s.c[i] - L) / (H - L) * 100, vr = s.v[i] / volAvg;
  const inst = sumLast(s.f, N) + sumLast(s.t, N), mChg = s.m[i] - s.m[i - N], pChg = s.c[i] - s.c[i - N];
  const red = s.c[i] > s.o[i];
  let name = '看不出', cls = 'flat';
  if (pos >= TH.hi && vr >= TH.boom && inst < 0) { name = '⚠️ 出貨'; cls = 'down'; }
  else if (vr >= TH.boom && red && inst > 0 && pos < TH.hi) { name = '🔥 啟動'; cls = 'up'; }
  else if (pos >= TH.hi && inst > 0 && pChg > 0 && vr >= 1) { name = '📈 拉升'; cls = 'up'; }
  else if (pos <= TH.lo && mChg < 0 && pChg < 0) { name = '🌀 洗盤'; }
  else if (pos <= TH.lo && vr <= TH.quiet) { name = '😴 吸籌'; }
  return { N, name, cls, pos, vr, inst, mChg, pChg };
}
function renderStageMulti() {
  const rows = WINDOWS.map(stageAt);
  const body = rows.map((r, k) => r.na
    ? `<tr><td>${WINDOWS[k]} 日</td><td class="na" colspan="6">${r.na}</td></tr>`
    : `<tr><td>${r.N} 日</td><td class="lab ${r.cls}">${r.name}</td><td>${r.pos.toFixed(0)}%</td><td>${r.vr.toFixed(2)}</td>
       <td class="${r.inst > 0 ? 'up' : r.inst < 0 ? 'down' : 'flat'}">${signed(r.inst)}</td>
       <td class="${r.mChg > 0 ? 'up' : r.mChg < 0 ? 'down' : 'flat'}">${signed(r.mChg)}</td>
       <td class="${r.pChg > 0 ? 'up' : r.pChg < 0 ? 'down' : 'flat'}">${r.pChg > 0 ? '+' : ''}${r.pChg.toFixed(1)}</td></tr>`).join('');
  const ok = rows.filter(r => !r.na), groups = {};
  ok.forEach(r => { (groups[r.name.replace(/^[^一-鿿]+/, '')] ||= []).push(r.N); });
  const names = Object.keys(groups);
  const sum = !ok.length ? '資料不足，每個週期都算不出來'
    : names.length === 1 ? `各週期的結論一致：${names[0]}（${groups[names[0]].join('、')} 日）`
    : '各週期的結論不一致：' + names.map(nm => `「${nm}」：${groups[nm].join('、')} 日`).join('；');
  $('stageCard').innerHTML = `
    <h2>現在像哪一個階段？（五個週期一起看）</h2>
    <div class="stage-label ms-sum">${sum}</div>
    <div class="ms-wrap"><table class="tbl ms"><thead><tr><th>週期</th><th>判斷</th><th>位階</th><th>量比</th><th>外資＋投信累計（張）</th><th>融資變化（張）</th><th>股價變化（元）</th></tr></thead><tbody>${body}</tbody></table></div>
    <details class="rules"><summary>每一列是怎麼判斷的（按開來看規則）</summary>
      <p>每一列用同一組規則，只是把「近 N 日」的 N 換成 5、10、20、30、60。位階＝近 N 日高低區間；量比＝今天成交量 ÷ 前 N 日平均；累計與變化＝近 N 日。依序檢查，符合第一個就停：<br>
      ⚠️ 出貨：位階 ≥ ${TH.hi}%、量比 ≥ ${TH.boom}、外資＋投信累計 &lt; 0<br>
      🔥 啟動：量比 ≥ ${TH.boom}、今天收紅 K、外資＋投信累計 &gt; 0、位階 &lt; ${TH.hi}%（放量起漲，還沒到高檔）<br>
      📈 拉升：位階 ≥ ${TH.hi}%、外資＋投信累計 &gt; 0、股價變化 &gt; 0、量比 ≥ 1<br>
      🌀 洗盤：位階 ≤ ${TH.lo}%、融資減少、股價下跌<br>
      😴 吸籌：位階 ≤ ${TH.lo}%、量比 ≤ ${TH.quiet}<br>
      都不符合：看不出。需要 N＋1 個交易日的資料，不夠就寫「資料不足」，不硬算。</p></details>
    <div class="hint"><b>怎麼讀：</b>重點不是某一列，而是各列之間有沒有一致。短週期和長週期結論不同，代表短線和長線在講不同的故事。這是把數字整理成階段名稱的簡化判讀，<b>不是預測，也不是買賣建議</b>，門檻是老師訂的，可以再調整。</div>`;
}

function renderAll() {
  renderPicker();
  renderPrice();
  renderChart();
  renderInst();
  renderMargin();
  renderPos();
  renderStage();
  renderStageMulti();
  renderMA();
  renderFresh();
  renderBrief();
  renderDays();
  renderRefresh();
  $('chartTitle').textContent = `近 ${view().d.length} 個交易日走勢`;
}
renderAll();
</script>
