<!--
  【給 AI 的說明】這是一個「單一檔案」的迷你台股分析器，所有資料都已經放在下面「資料區」，
  不需要連網。使用者會一次一個步驟，請你幫他在這個頁面上「新增功能卡片」。
  規則：
  1. 請輸出完整的 HTML 檔案，不要省略任何一段，不要只給片段。
  2. 「資料區」(const DATA = ...) 一個字都不要改、不要刪、不要重新生成，原樣保留。
  3. 台股慣例：紅色＝漲／買超，綠色＝跌／賣超，不要用歐美的綠漲紅跌。
  4. 資料欄位：d日期 o開 h高 l低 c收 v成交量(張) f外資買賣超(張) t投信買賣超(張)
     s自營商自行買賣超(張) m融資餘額(張) sh融券餘額(張)。陣列由舊到新，最後一筆是最新一天。
  5. 資料裡沒有的東西不要編造；算不出來就明確顯示「資料不足」。
-->
<style>
:root{--bg:#f1f7f4;--card:#fff;--ink:#17332b;--muted:#6b8179;--line:#dbe8e2;--brand:#0f766e;--up:#e0343a;--down:#16a34a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 40px}
header h1{margin:0;font-size:1.35rem;color:var(--brand)}
header p{margin:2px 0 14px;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1rem}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.price-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px}
.big{font-size:2.3rem;font-weight:800;line-height:1.1}
.sub{font-size:.9rem;color:var(--muted)}
.ohlc{display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.ohlc b{color:var(--ink)}
svg{width:100%;height:auto;display:block}
.legend{font-size:.78rem;color:var(--muted);margin:8px 0 0}
footer{font-size:.75rem;color:var(--muted);margin-top:18px}

.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 8px;border-bottom:1px solid #eef4f1;text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.badge.up{background:#fdecec}.badge.down{background:#e8f6ee}.badge.flat{background:#eef2f0;color:var(--muted)}
.verdict{margin:12px 0 0;font-weight:700}
.hint{background:#f4faf7;border:1px dashed #b9d8cd;border-radius:10px;padding:10px 12px;font-size:.84rem;margin-top:12px}
.hint a{color:var(--brand)}
</style>
</head>

<div class="wrap">

const IDS = ['2330', '2317', '2882', '2412', '2603', '0056'].filter(id => DATA[id]);  // 按鈕顯示順序
let cur = IDS[0];
const $ = id => document.getElementById(id);
const n0 = x => Number(x).toLocaleString('zh-TW');

function renderPicker() {
  $('picker').innerHTML = IDS.map(id =>
    `<button class="chip ${id === cur ? 'on' : ''}" data-id="${id}">${DATA[id].name} ${id}</button>`).join('');
  document.querySelectorAll('#picker .chip').forEach(b => b.onclick = () => { cur = b.dataset.id; renderAll(); });
}

function renderPrice() {
  const s = DATA[cur], i = s.d.length - 1;
  const c = s.c[i], p = s.c[i - 1], ch = c - p, cp = ch / p * 100;
  const cls = ch > 0 ? 'up' : ch < 0 ? 'down' : 'flat';
  const arrow = ch > 0 ? '▲' : ch < 0 ? '▼' : '－';
  $('priceCard').innerHTML = `
    <div class="price-row">
      <div>
        <div class="sub">${s.name} ${cur}</div>
        <div class="big ${cls}">${c.toFixed(2)}</div>
        <div class="${cls}">${arrow} ${Math.abs(ch).toFixed(2)}（${Math.abs(cp).toFixed(2)}%）</div>
        <div class="sub">${s.d[i]} 收盤</div>
      </div>
      <div class="ohlc">
        <span>開 <b>${s.o[i]}</b></span><span>高 <b>${s.h[i]}</b></span>
        <span>低 <b>${s.l[i]}</b></span><span>成交量 <b>${n0(s.v[i])}</b> 張</span>
      </div>
    </div>`;
}

function renderChart() {
  const s = DATA[cur], n = s.d.length;
  const W = 900, H = 330, padL = 8, padR = 56, top = 10, priceH = 215, volTop = 245, volH = 70;
  const hi0 = Math.max(...s.h), lo0 = Math.min(...s.l), pad = (hi0 - lo0) * 0.05 || 1;
  const hi = hi0 + pad, lo = lo0 - pad;
  const y = v => top + (hi - v) / (hi - lo) * priceH;
  const step = (W - padL - padR) / n, bw = step * 0.62;
  const vMax = Math.max(...s.v, 1);
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, yy = y(v);
    g += `<line x1="${padL}" x2="${W - padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#e5eeea"/>` +
         `<text x="${W - padR + 6}" y="${(yy + 4).toFixed(1)}" font-size="11" fill="#6b8179">${v.toFixed(v > 100 ? 0 : 1)}</text>`;
  }
  for (let i = 0; i < n; i++) {
    const cx = padL + step * i + step / 2;
    const col = s.c[i] > s.o[i] ? '#e0343a' : s.c[i] < s.o[i] ? '#16a34a' : '#8a9a93';
    const yo = y(s.o[i]), yc = y(s.c[i]);
    const vh = s.v[i] / vMax * volH;
    g += `<g><title>${s.d[i]}  開${s.o[i]} 高${s.h[i]} 低${s.l[i]} 收${s.c[i]}  量${n0(s.v[i])}張</title>` +
         `<line x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="${y(s.h[i]).toFixed(1)}" y2="${y(s.l[i]).toFixed(1)}" stroke="${col}" stroke-width="1.6"/>` +
         `<rect x="${(cx - bw / 2).toFixed(1)}" y="${Math.min(yo, yc).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5, Math.abs(yc - yo)).toFixed(1)}" fill="${col}"/>` +
         `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(volTop + volH - vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${vh.toFixed(1)}" fill="${col}" opacity=".45"/></g>`;
  }
  const lab = i => s.d[i].slice(5).replace('-', '/');
  g += `<text x="${padL}" y="${H - 2}" font-size="11" fill="#6b8179">${lab(0)}</text>` +
       `<text x="${(W - padR) / 2}" y="${H - 2}" font-size="11" fill="#6b8179" text-anchor="middle">${lab(Math.floor(n / 2))}</text>` +
       `<text x="${W - padR}" y="${H - 2}" font-size="11" fill="#6b8179" text-anchor="end">${lab(n - 1)}</text>`;
  $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.name}近60日K線與成交量">${g}</svg>`;
}


/* ---- 三大法人 ---- */
function streak(a) {            // 從最新一天往回數，同方向連續幾天（遇到 0 就中斷）
  let d = 0, dir = 0;
  for (let i = a.length - 1; i >= 0; i--) {
    const sg = a[i] > 0 ? 1 : a[i] < 0 ? -1 : 0;
    if (sg === 0) break;
    if (dir === 0) dir = sg;
    if (sg !== dir) break;
    d++;
  }
  return { dir, d };
}
const sumLast = (a, k) => a.slice(-k).reduce((x, y) => x + y, 0);
const signed = v => (v > 0 ? '+' : '') + n0(v);
const streakBadge = st => !st.d ? '<span class="badge flat">持平／無資料</span>'
  : st.dir > 0 ? `<span class="badge up">連買 ${st.d} 天</span>` : `<span class="badge down">連賣 ${st.d} 天</span>`;

function renderInst() {
  const s = DATA[cur], i = s.d.length - 1;
  const rows = [['外資', 'f'], ['投信', 't'], ['自營商（自行買賣）', 's']];
  const body = rows.map(([nm, k]) => {
    const a = s[k], v = a[i], five = sumLast(a, 5), st = streak(a);
    const c1 = v > 0 ? 'up' : v < 0 ? 'down' : 'flat', c5 = five > 0 ? 'up' : five < 0 ? 'down' : 'flat';
    return `<tr><td>${nm}</td><td class="${c1}">${signed(v)}</td><td class="${c5}">${signed(five)}</td><td>${streakBadge(st)}</td></tr>`;
  }).join('');

  // 近5日長條圖：每天三根（外資、投信、自營），向上＝買超（紅），向下＝賣超（綠）
  const W = 900, H = 200, base = 92, gw = (W - 20) / 5;
  const vals = [];
  for (let j = 4; j >= 0; j--) rows.forEach(([, k]) => vals.push(Math.abs(s[k][i - j])));
  const mx = Math.max(...vals, 1), scale = 52 / mx;
  let g = `<line x1="10" x2="${W - 10}" y1="${base}" y2="${base}" stroke="#c9d9d2"/>`;
  for (let j = 0; j < 5; j++) {
    const idx = i - 4 + j, gx = 10 + gw * j;
    rows.forEach(([, k], b) => {
      const v = s[k][idx], h = Math.max(1, Math.abs(v) * scale), x = gx + 28 + b * 44;
      const yy = v >= 0 ? base - h : base, col = v > 0 ? '#e0343a' : v < 0 ? '#16a34a' : '#8a9a93';
      g += `<rect x="${x}" y="${yy.toFixed(1)}" width="34" height="${h.toFixed(1)}" fill="${col}"/>` +
           `<text x="${x + 17}" y="${(v >= 0 ? yy - 4 : yy + h + 11).toFixed(1)}" font-size="10" fill="${col}" text-anchor="middle">${signed(v)}</text>` +
           `<text x="${x + 17}" y="${H - 22}" font-size="10" fill="#6b8179" text-anchor="middle">${['外', '投', '自'][b]}</text>`;
    });
    g += `<text x="${gx + gw / 2 - 6}" y="${H - 6}" font-size="11" fill="#6b8179" text-anchor="middle">${s.d[idx].slice(5).replace('-', '/')}</text>`;
  }

  const sf = streak(s.f), sT = streak(s.t);
  let msg;
  if (sf.dir > 0 && sf.d >= 3 && sT.dir > 0 && sT.d >= 3) msg = '🔥 外資、投信同時連買 3 天以上：法人方向一致，是比較強的訊號。';
  else if (sf.dir < 0 && sf.d >= 3 && sT.dir < 0 && sT.d >= 3) msg = '⚠️ 外資、投信同時連賣 3 天以上：法人方向一致偏空，要小心。';
  else if (sf.d && sT.d && sf.dir !== sT.dir) msg = '外資和投信方向不同，訊號分歧，先觀察，不要急著下結論。';
  else msg = '目前沒有明顯的「連續」訊號。單日買賣超意義有限，連續才是重點。';

  $('instCard').innerHTML = `
    <h2>三大法人買賣超（單位：張）</h2>
    <table class="tbl"><thead><tr><th>法人</th><th>${s.d[i].slice(5).replace('-', '/')} 今日</th><th>近 5 日累計</th><th>連續</th></tr></thead><tbody>${body}</tbody></table>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近5日三大法人買賣超長條圖" style="margin-top:12px">${g}</svg>
    <p class="verdict">${msg}</p>
    <div class="hint">
      <b>自營商只算「自行買賣」</b>，避險部位不算——避險是為了對沖權證，不代表看多看空。<br>
      <b>核對一下：</b>打開 <a href="https://histock.tw/stock/${cur}" target="_blank" rel="noopener">HiStock ${cur}</a>，
      找 ${s.d[i]} 那天的外資買賣超，應該和上表「今日外資」一樣（單位都是張）。對不上就是哪裡算錯了。
    </div>`;
}

function renderAll() {
  renderPicker();
  renderPrice();
  renderChart();
  renderInst();
}
renderAll();
</script>
</body>
</html>
